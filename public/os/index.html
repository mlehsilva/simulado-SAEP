<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFix - Ordens de Serviço</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>AutoFix Mecânica - Gerenciamento de OS</h1>
        <a href="../dashboard/index.html" class="btn btn-secondary">Voltar ao Menu</a>
    </header>

    <main style="padding: 20px;">
        <section class="form-container" style="margin-bottom: 30px; border: 1px solid #ccc; padding: 20px; border-radius: 8px;">
            <h2>Abrir Nova Ordem de Serviço</h2>
            <div id="mensagemStatus" style="display: none; font-weight: bold; margin-bottom: 10px;"></div>
            
            <form id="formOS">
                <div style="margin-bottom: 10px;">
                    <label for="selectCliente">Cliente:</label><br>
                    <select id="selectCliente" required style="width: 100%; padding: 8px;">
                        <option value="">Selecione um cliente...</option>
                    </select>
                </div>

                <div style="margin-bottom: 10px;">
                    <label for="selectVeiculo">Veículo:</label><br>
                    <select id="selectVeiculo" required style="width: 100%; padding: 8px;">
                        <option value="">Selecione um veículo...</option>
                    </select>
                </div>

                <div style="margin-bottom: 10px;">
                    <label for="descricaoProblema">Descrição do Problema:</label><br>
                    <textarea id="descricaoProblema" required style="width: 100%; padding: 8px; height: 80px;"></textarea>
                </div>

                <!-- NOVO CAMPO: Situação da OS -->
                <div style="margin-bottom: 10px;">
                    <label for="selectSituacao">Situação Atual:</label><br>
                    <select id="selectSituacao" required style="width: 100%; padding: 8px;">
                        <option value="Não Iniciado" selected>Não Iniciado</option>
                        <option value="Em Andamento">Em Andamento</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="valorTotal">Valor Total (R$):</label><br>
                    <input type="number" id="valorTotal" step="0.01" required style="width: 100%; padding: 8px;">
                </div>

                <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;">Abrir OS</button>
            </form>
        </section>

        <section class="list-container">
            <h2>Ordens de Serviço Registradas</h2>
            <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead style="background-color: #f2f2f2;">
                    <tr>
                        <th style="padding: 10px;">Nº OS</th>
                        <th style="padding: 10px;">Cliente</th>
                        <th style="padding: 10px;">Veículo (Placa)</th>
                        <th style="padding: 10px;">Descrição do Problema</th>
                        <th style="padding: 10px;">Situação</th> <!-- NOVA COLUNA -->
                        <th style="padding: 10px;">Valor</th>
                        <th style="padding: 10px;">Data de Abertura</th>
                    </tr>
                </thead>
                <tbody id="tabelaOS">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
