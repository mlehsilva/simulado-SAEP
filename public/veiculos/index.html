<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFix - Veículos</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        select.form-control { width: 100%; height: 38px; background: white; }
    </style>
</head>
<body>
    <div class="header-container">
        <h2>🚗 Gestão de Veículos</h2>
        <a href="../dashboard/index.html" class="btn btn-secondary">Voltar ao Menu</a>
    </div>

    <div class="card">
        <h5>Registrar Veículo de Cliente</h5>
        <form id="formVeiculo">
            <div class="form-grid">
                <input type="text" id="placa" placeholder="Placa" class="form-control" required>
                <input type="text" id="marca" placeholder="Marca" class="form-control" required>
                <input type="text" id="modelo" placeholder="Modelo" class="form-control" required>
                <input type="number" id="ano" placeholder="Ano" class="form-control" required>
                <select id="cliente_id" class="form-control" required>
                    <option value="">-- Selecione o Proprietário --</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success" style="margin-top: 10px;">Registrar Veículo</button>
        </form>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th>Placa</th>
                <th>Marca / Modelo</th>
                <th>Ano</th>
                <th>Proprietário Responsável</th>
            </tr>
        </thead>
        <tbody id="tabelaVeiculos"></tbody>
    </table>
<script src="script.js"></script>
</body>
</html>
